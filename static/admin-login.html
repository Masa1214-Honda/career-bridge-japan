<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login — Career Bridge Japan</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="login"><div class="card"><a class="brand" href="/">Career Bridge Japan</a><h2>Admin login</h2><form id="login"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div><div id="err" class="error" hidden></div><button class="btn" type="submit">Sign in</button></form></div></main><script src="/static/common.js"></script><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),err=document.querySelector('#err');b.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location.href='/admin'}catch(x){err.textContent=x.message;err.hidden=false;b.disabled=false}}</script></body></html>
